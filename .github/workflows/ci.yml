
name: Showroom CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create test environment
        run: |
          echo 'DB_CONNECTION_STRING=Host=localhost;Database=ShowroomTest;Username=postgres;Password=test' > .env
          echo 'JWT_KEY=ThisIsOnlyATestKeyForGitHubActions1234567890' >> .env
          cp .env TestingTask1/.env

      - name: Restore
        run: dotnet restore TestingTask1.Tests/TestingTask1.Tests.csproj

      - name: Build
        run: dotnet build TestingTask1.Tests/TestingTask1.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test TestingTask1.Tests/TestingTask1.Tests.csproj --no-build
